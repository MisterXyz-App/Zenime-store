<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Zenime Store — Aktivasi Premium Zenime{% endblock %}</title>
  <meta name="description" content="{% block description %}Aktivasi Premium akun Zenime lewat QRIS resmi. Otomatis masuk ke akun, tanpa perlu buka app.{% endblock %}" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/zenime-icon-256.png') }}" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body>

  <nav class="nav">
    <div class="container nav__inner">
      <a href="{{ url_for('main.index') }}" class="nav__brand">
        <span class="mark"><img src="{{ url_for('static', filename='img/zenime-icon-256.png') }}" alt="Zenime" /></span>
        <span>Zenime Store</span>
      </a>
      <div class="nav__links">
        <a href="{{ url_for('main.download') }}">Unduh Aplikasi</a>
        <a href="{{ url_for('main.index') }}#cara-kerja">Cara Kerja</a>
        <a href="{{ url_for('main.beli_premium') }}#paket">Paket</a>
        <a href="{{ url_for('main.index') }}#bantuan">Bantuan</a>
      </div>
      <a href="{{ url_for('main.beli_premium') }}" class="btn btn-primary">
        <i class="fa-solid fa-bolt"></i> Aktifkan Premium
      </a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span class="mark" style="width:22px; height:22px; border-radius:6px;">
          <img src="{{ url_for('static', filename='img/zenime-icon-256.png') }}" alt="Zenime" />
        </span>
        <span>Zenime Store</span>
      </div>
      <div class="footer__meta">
        <i class="fa-solid fa-shield-halved"></i>Pembayaran diproses lewat QRIS resmi via Sakurupiah &nbsp;·&nbsp; © {{ current_year }} Zenime
      </div>
    </div>
  </footer>

  <div class="toast" id="globalToast">
    <i class="fa-solid fa-circle-info"></i>
    <span id="globalToastMsg"></span>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
