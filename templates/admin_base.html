<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" id="metaThemeColor" />
  <script>
    // Terapkan tema sebelum render supaya tidak ada kedipan (sama seperti base.html).
    (function () {
      try {
        if (localStorage.getItem('zenime-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* abaikan */ }
    })();
  </script>
  <title>{% block title %}Dashboard — Admin Zenime Store{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body class="adm">
  <div class="adm-shell">

    <aside class="adm-side" aria-label="Navigasi admin">
      <a href="{{ url_for('admin.index') }}" class="adm-brand">
        <span class="adm-brand__mark"><img src="{{ url_for('static', filename='img/zenime-icon-256.png') }}" alt="" /></span>
        <span class="adm-brand__text"><strong>Zenime</strong><small>Admin</small></span>
      </a>

      <nav class="adm-nav">
        <span class="adm-nav__label">Menu</span>
        <a href="{{ url_for('admin.manual_payments') }}" class="adm-nav__item is-active" aria-current="page">
          <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
          <span>Klaim manual</span>
          {% if qs is defined and qs.total %}<span class="adm-nav__badge">{{ qs.total }}</span>{% endif %}
        </a>

        <span class="adm-nav__label">Pintasan</span>
        <a href="{{ url_for('main.index') }}" target="_blank" rel="noopener" class="adm-nav__item">
          <i class="fa-solid fa-store" aria-hidden="true"></i><span>Lihat toko</span>
          <i class="fa-solid fa-arrow-up-right-from-square adm-nav__ext" aria-hidden="true"></i>
        </a>
        <a href="{{ url_for('main.top_up_coin') }}" target="_blank" rel="noopener" class="adm-nav__item">
          <i class="fa-solid fa-coins" aria-hidden="true"></i><span>Halaman ZCoin</span>
          <i class="fa-solid fa-arrow-up-right-from-square adm-nav__ext" aria-hidden="true"></i>
        </a>
      </nav>

      <div class="adm-side__foot">
        <form method="post" action="{{ url_for('admin.logout') }}">
          <button type="submit" class="adm-nav__item adm-nav__item--btn">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>Keluar</span>
          </button>
        </form>
      </div>
    </aside>

    <div class="adm-main">
      <header class="adm-top">
        <a href="{{ url_for('admin.index') }}" class="adm-brand adm-brand--top" aria-label="Dashboard admin">
          <span class="adm-brand__mark"><img src="{{ url_for('static', filename='img/zenime-icon-256.png') }}" alt="" /></span>
          <span class="adm-brand__text"><strong>Zenime</strong><small>Admin</small></span>
        </a>
        <div class="adm-top__title">{% block top_title %}Dashboard{% endblock %}</div>

        <div class="adm-top__actions">
          <a href="{{ url_for('admin.manual_payments') }}" class="icon-btn" aria-label="Muat ulang data" title="Muat ulang">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
          </a>
          <button type="button" class="icon-btn" id="themeToggle" aria-label="Ganti ke tema terang" aria-pressed="false">
            <i class="fa-solid fa-sun" aria-hidden="true"></i>
          </button>
          <form method="post" action="{{ url_for('admin.logout') }}" class="adm-top__logout">
            <button type="submit" class="icon-btn" aria-label="Keluar" title="Keluar">
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </header>

      <main id="main" class="adm-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="toast" id="globalToast" role="status" aria-live="polite">
    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
    <span id="globalToastMsg"></span>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
